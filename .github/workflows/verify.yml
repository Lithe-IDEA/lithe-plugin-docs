name: Verify

# contract/v1 is a byte-identical mirror of the Lithe plugin contract, pinned
# by contract.lock.json, and the SDKs are tested against Rust Core at that same
# commit. The weekly run also reports how the contract has moved on and runs
# the SDK scenario against Lithe's preview branch, where changes merge; Lithe's
# default branch, main, only moves at a release.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract mirror
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test the repository tooling
        run: node --test scripts/*.test.mjs

      - name: Compare the mirror with the pinned Lithe commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/contract.mjs verify --upstream

      - name: Report contract changes since the pin
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/contract.mjs drift --ref preview

  sdk-node:
    name: Node.js SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The SDK supports Node.js 20.3 and newer, so it is tested on the oldest
      # supported major.
      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Test
        run: node --test sdk/node/test/*.test.mjs

  sdk-java:
    name: Java SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The SDK supports Java 8: the tests run on a Java 8 runtime, while
      # Maven builds with the newer JDK set up last.
      - name: Set up Java 8 runtime
        id: java8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - name: Set up Java 21 for Maven
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and test on Java 8
        env:
          JAVA8: ${{ steps.java8.outputs.path }}/bin/java
        run: mvn -B -ntp -f sdk/java/pom.xml verify -Djvm="$JAVA8"

  sdk-e2e:
    name: SDK end-to-end with Rust Core
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Set up Java 8 runtime
        id: java8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - name: Set up Java 21 for Maven
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .artifacts/lithe/rust/target
          key: sdk-e2e-${{ runner.os }}-${{ hashFiles('contract.lock.json') }}
          restore-keys: sdk-e2e-${{ runner.os }}-

      - name: Run against the pinned Lithe commit
        env:
          LITHE_PLUGIN_SDK_JAVA_RUNTIME: ${{ steps.java8.outputs.path }}/bin/java
        run: node scripts/sdk-e2e.mjs

      - name: Run against Lithe's preview branch
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          LITHE_PLUGIN_SDK_JAVA_RUNTIME: ${{ steps.java8.outputs.path }}/bin/java
        run: node scripts/sdk-e2e.mjs --ref preview
